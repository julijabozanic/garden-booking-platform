<body style="background-image: url('assets/pool.jpg'); background-size: cover; background-position: center; background-repeat: no-repeat; height: 100vh; margin: 0; padding: 0;">


<!-- Header -->
<header>
  <nav>
    <a routerLink="/">Početna</a> | 
    <a routerLink="/registration">Registracija</a> | 
    <a routerLink="/password-new">Promeni lozinku</a>
  </nav>
  <hr>
</header>

<!-- Glavni sadržaj -->
<main>
  <table>
    <thead>
      <tr>
        <th colspan="2">Promena lozinke</th> <!-- Dodajemo naslov tabele -->
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>Korisnicko ime:</td>
        <td><input type="text" [(ngModel)]="username" name="username" required></td>
      </tr>
      <tr>
        <td>Stara lozinka:</td>
        <td><input type="password" [(ngModel)]="password1" name="password1" required></td>
      </tr>
      <tr>
        <td>Nova lozinka:</td>
        <td><input type="password" [(ngModel)]="password2" name="password2" required></td>
      </tr>
      <tr>
        <td>Ponovi novu lozinku:</td>
        <td><input type="password" [(ngModel)]="password3" name="password3" required></td>
      </tr>
      <tr>
        <td colspan="2" style="text-align: center;">
          <button (click)="updatePassword()">Sačuvaj</button>
        </td>
      </tr>
      <tr>
        <td colspan="2" style="text-align: center;">
          <a routerLink="/">Povratak na početnu stranicu</a>
        </td>
      </tr>
    </tbody>
  </table>
</main>

<!-- Footer -->
<footer>
  <hr>
  <p>&copy; 2024 Vaša kompanija. Sva prava zadržana.</p>
</footer>
